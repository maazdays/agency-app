<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1105">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agency Plan Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Plan: a pocket money app for a one-person agency. Olive-black floor, lime hero cards with dark ink,
   dark tiles with lime icons, a floating center button. One phone column; bottom nav with 4 tabs + center action. */
:root {
  --bg: #0E1406;
  --bg-2: #131A0A;
  --surface: rgba(255,255,255,.055);
  --surface-2: rgba(255,255,255,.1);
  --line: rgba(255,255,255,.12);
  --glass-hi: rgba(255,255,255,.22);
  --lime: #D6F25C;
  --lime-2: #C3E04A;
  --lime-ink: #151B07;
  --lime-soft: rgba(214,242,92,.12);
  --text: #F1F5E6;
  --muted: #9BA98A;
  --green: #7EE07A;
  --red: #FF8A7A;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; }
html { scroll-behavior: smooth; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); -webkit-overflow-scrolling: touch; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
.tab-num { font-variant-numeric: tabular-nums; }

.app { max-width: 480px; margin: 0 auto; padding: 14px 18px 130px; min-height: 100vh; }
.screen { animation: enter .32s cubic-bezier(.2,.8,.2,1) both; }
.screen.back-anim { animation-name: enter-back; }
@keyframes enter { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes enter-back { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

/* Header */
.hdr { display: flex; align-items: center; gap: 12px; padding: 6px 0 18px; }
.hdr .title { flex: 1; text-align: center; font-weight: 700; font-size: 17px; }
.hdr .hi { flex: 1; }
.hdr .hi b { display: block; font-size: 16px; }
.hdr .hi span { color: var(--muted); font-size: 13px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; transition: transform .15s; }
.round:active { transform: scale(.92); }
.round.lime { background: var(--lime); border-color: var(--lime); }
.round.lime svg { stroke: var(--lime-ink); }
.ic { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.me { width: 44px; height: 44px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-weight: 800; flex: none; }

/* Hero card */
.hero {
  background: var(--lime); color: var(--lime-ink); border-radius: 28px; padding: 20px; position: relative;
  box-shadow: 0 18px 40px -18px rgba(214,242,92,.45);
}
.hero .lbl { font-size: 13px; font-weight: 600; opacity: .75; }
.hero .row1 { display: flex; justify-content: space-between; align-items: center; }
.big { font-size: 42px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; margin-top: 6px; }
.big small { font-size: .55em; font-weight: 700; }
.badge { display: inline-flex; align-items: center; gap: 6px; background: var(--lime-ink); color: var(--lime); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.hero .sub2 { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 13px; font-weight: 600; }
.hero .sub2 span { opacity: .7; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
.act { display: grid; justify-items: center; gap: 6px; background: none; border: 0; color: var(--lime-ink); font-size: 12.5px; font-weight: 700; }
.act .sq { width: 54px; height: 54px; border-radius: 16px; background: var(--lime-ink); display: grid; place-items: center; transition: transform .15s; }
.act .sq svg { width: 22px; height: 22px; stroke: var(--lime); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.act:active .sq { transform: scale(.9); }
.notch { width: 46px; height: 22px; margin: -2px auto 0; background: var(--lime); border-radius: 0 0 16px 16px; display: grid; place-items: center; }
.notch svg { width: 14px; height: 14px; stroke: var(--lime-ink); fill: none; stroke-width: 2.5; }

/* Sections */
.sec { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 12px; }
.sec h3 { font-size: 16px; font-weight: 700; }
.pill-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.pill-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; }

.chips-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.add-tile { width: 56px; height: 56px; border-radius: 18px; border: 1.5px dashed var(--lime); display: grid; place-items: center; flex: none; background: none; }
.add-tile svg { width: 22px; height: 22px; stroke: var(--lime); fill: none; stroke-width: 2; }
.cchip { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); flex: none; text-align: left; transition: transform .15s; }
.cchip:active { transform: scale(.96); }
.av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #2D3A16, #44561E); color: var(--lime); display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
.av.lg { width: 52px; height: 52px; font-size: 18px; }
.cchip b { display: block; font-size: 13.5px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cchip span { font-size: 12px; color: var(--muted); }

.list { display: grid; gap: 4px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 12px 4px; background: none; border: 0; border-bottom: 1px solid var(--line); transition: background .15s;
}
.row:active { background: var(--surface); }
.row .tx { flex: 1; min-width: 0; }
.row .t1 { font-weight: 700; font-size: 14.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { color: var(--muted); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { text-align: right; font-weight: 700; font-size: 14.5px; }
.row .amt small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.plus { color: var(--green); }
.minus { color: var(--red); }
.sq-ic { width: 42px; height: 42px; border-radius: 13px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.sq-ic svg { width: 19px; height: 19px; stroke: var(--lime); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.empty { text-align: center; color: var(--muted); padding: 30px 12px; border: 1.5px dashed var(--line); border-radius: 20px; font-size: 14px; }

.status { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: inline-block; }
.status.Sent, .status.Final { color: var(--lime); border-color: var(--lime); }
.status.Accepted, .status.Paid { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
.tile .k { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.tile .v { font-size: 20px; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; }

/* Quick action grid (client page) */
.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.q { display: grid; justify-items: center; gap: 8px; background: none; border: 0; font-size: 12px; font-weight: 600; color: var(--text); text-align: center; }
.q .box { width: 100%; aspect-ratio: 1; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; transition: transform .15s, background .15s; }
.q .box svg { width: 24px; height: 24px; stroke: var(--lime); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.q:active .box { transform: scale(.92); background: var(--surface-2); }

/* Forms */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .olabel { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.inp, .field input, .field textarea, .field select {
  width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); outline: none; transition: border-color .2s;
}
.field input:focus, .field textarea:focus, .field select:focus, .inp:focus { border-color: var(--lime); }
.field textarea { min-height: 80px; resize: vertical; }
.hint { color: var(--muted); font-size: 12.5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amount-in { font-size: 34px !important; font-weight: 800; text-align: center; padding: 16px !important; letter-spacing: -0.03em; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); font-size: 13.5px; font-weight: 600; transition: all .18s; }
.seg button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 700; text-decoration: none; color: var(--text); transition: transform .15s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn.lime { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--red); color: var(--red); background: transparent; }
.btn.danger.armed { background: var(--red); color: var(--lime-ink); }
.btn.full { width: 100%; }
.btn.sm { padding: 9px 13px; font-size: 13px; border-radius: 12px; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* Services */
.svc { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); margin-bottom: 10px; overflow: hidden; transition: border-color .2s; }
.svc.on { border-color: var(--lime); }
.svc-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; background: none; border: 0; text-align: left; }
.svc-head .name { font-weight: 700; flex: 1; }
.svc-head .name small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
.chk { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center; flex: none; transition: all .2s; }
.chk svg { width: 15px; height: 15px; stroke: var(--lime-ink); fill: none; stroke-width: 3; opacity: 0; }
.svc.on .chk { background: var(--lime); border-color: var(--lime); }
.svc.on .chk svg { opacity: 1; }
.svc-body { display: none; padding: 0 14px 16px; gap: 14px; }
.svc.on .svc-body { display: grid; animation: enter .25s ease both; }
.fee { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }

.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px; margin-bottom: 16px; }
.tabs button { flex: 1; padding: 10px; border-radius: 12px; border: 0; background: none; font-weight: 700; font-size: 13.5px; color: var(--muted); transition: all .2s; }
.tabs button[aria-pressed="true"] { background: var(--lime); color: var(--lime-ink); }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-align: left; margin-bottom: 14px; }
.knob { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: transform .2s; }
.switch[aria-pressed="true"] .knob { background: var(--lime); }
.switch[aria-pressed="true"] .knob::after { transform: translateX(18px); background: var(--lime-ink); }

.preview { white-space: pre-wrap; font-size: 13.5px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; color: #D9E2C8; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
.card h3 { font-size: 15px; margin-bottom: 4px; }

/* Invoice lines */
.line { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 8px; display: grid; gap: 8px; }
.line .top { display: flex; gap: 8px; }
.line .top input { flex: 1; }
.line .nums { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: center; }
.line input { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); outline: none; }
.line input:focus { border-color: var(--lime); }
.x { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); display: grid; place-items: center; flex: none; }
.x svg { width: 16px; height: 16px; stroke: var(--red); fill: none; stroke-width: 2.4; }
.sumbox { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 8px; }
.sumbox div { display: flex; justify-content: space-between; color: var(--muted); }
.sumbox .tot { color: var(--lime); font-weight: 800; font-size: 18px; border-top: 1px solid var(--line); padding-top: 8px; }
.inv-img { width: 100%; border-radius: 18px; border: 1px solid var(--line); display: block; }

/* Bottom nav */
.nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20;
  width: min(444px, calc(100% - 28px)); height: 70px; border-radius: 26px;
  background: rgba(214,242,92,.97); display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: center;
  box-shadow: 0 16px 40px -10px rgba(0,0,0,.6);
}
.nav button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; color: rgba(21,27,7,.6); font-size: 11.5px; font-weight: 700; }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on { color: var(--lime-ink); }
.nav button.on svg { stroke-width: 2.4; }
.fab { width: 70px; height: 70px; border-radius: 50%; background: var(--lime-ink) !important; margin: -34px auto 0; display: grid !important; place-items: center; box-shadow: 0 0 0 6px var(--bg), 0 10px 24px rgba(0,0,0,.5); transition: transform .15s; }
.fab svg { width: 28px !important; height: 28px !important; stroke: var(--lime) !important; stroke-width: 2.4 !important; }
.fab:active { transform: scale(.92); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: linear-gradient(rgba(14,20,6,0), var(--bg) 24%);
  padding: 22px 18px calc(14px + env(safe-area-inset-bottom));
}
.bar-in { max-width: 444px; margin: 0 auto; display: grid; gap: 10px; }
.bar .rowb { display: flex; gap: 10px; }
.bar .rowb .btn { flex: 1; }
.totals { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 4px; }
.totals b { color: var(--lime); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; transition: opacity .25s; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 480px; margin: 0 auto;
  background: var(--bg-2); border-top-left-radius: 28px; border-top-right-radius: 28px; border: 1px solid var(--line); border-bottom: 0;
  padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto;
  transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
.sheet.show { transform: none; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { font-size: 19px; margin-bottom: 14px; }

.toast { position: fixed; left: 50%; bottom: 110px; transform: translate(-50%, 10px); background: var(--lime); color: var(--lime-ink); font-weight: 700; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 60; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.banner { background: #2A1A14; border: 1px solid var(--red); color: #F3C7BE; border-radius: 14px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px; }
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.monthbar b { font-size: 16px; }


/* ---------- Ice glass layer ---------- */
.bgfx { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bgfx i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
.bgfx i:nth-child(1) { width: 340px; height: 340px; background: #D6F25C; top: -120px; right: -110px; opacity: .32; animation: blob1 18s ease-in-out infinite alternate; }
.bgfx i:nth-child(2) { width: 300px; height: 300px; background: #2FA86A; bottom: 10%; left: -140px; opacity: .35; animation: blob2 22s ease-in-out infinite alternate; }
.bgfx i:nth-child(3) { width: 220px; height: 220px; background: #9FD8FF; top: 45%; right: -90px; opacity: .14; animation: blob1 26s ease-in-out infinite alternate-reverse; }
@keyframes blob1 { to { transform: translate(-60px, 80px) scale(1.15); } }
@keyframes blob2 { to { transform: translate(70px, -60px) scale(1.1); } }
.app { position: relative; z-index: 1; }
.glass, .tile, .card, .svc, .row, .cchip, .q .box, .field input, .field textarea, .field select, .inp, .tabs, .switch, .sumbox, .line, .preview, .round, .pill-btn, .btn:not(.lime) {
  background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}
.tile, .card, .tabs, .sumbox { -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }
.field select option { background: #141B0B; }
.list { gap: 8px !important; }
.row { border-radius: 18px !important; padding: 12px !important; }
.row:active, .cchip:active { background: rgba(255,255,255,.12) !important; }
.hero {
  background: linear-gradient(135deg, rgba(226,250,120,.96) 0%, rgba(205,238,84,.9) 45%, rgba(176,214,62,.86) 100%) !important;
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 22px 50px -20px rgba(214,242,92,.55) !important;
  overflow: hidden;
}
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 38%); pointer-events: none; }
.hero::after { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.45), rgba(255,255,255,0) 70%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.notch { background: rgba(205,238,84,.92) !important; }
.hdr { position: sticky; top: 0; z-index: 15; margin: -14px -18px 4px; padding: 14px 18px 14px !important; transition: background .25s, box-shadow .25s; }
.hdr.stuck { background: rgba(14,20,6,.86); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); box-shadow: 0 1px 0 var(--line); }
.nav { background: linear-gradient(135deg, rgba(226,250,120,.82), rgba(196,230,72,.78)) !important; -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%); border: 1px solid rgba(255,255,255,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 18px 40px -10px rgba(0,0,0,.6) !important; }
.sheet { background: rgba(20,28,10,.78) !important; -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%); border-color: var(--glass-hi) !important; }
.bar { background: linear-gradient(rgba(14,20,6,0), rgba(14,20,6,.85) 30%) !important; }
.empty { background: rgba(255,255,255,.03); }
.list > *, .chips-row > *, .qgrid > *, .tiles > * { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.list > *:nth-child(2), .chips-row > *:nth-child(2), .qgrid > *:nth-child(2), .tiles > *:nth-child(2) { animation-delay: .04s; }

  function optSummary(s, it) {

        db.clients = db.clients.filter(function (q) { return q.id !== cid; });
        save(); toast('Client deleted'); go({ name: 'clients' }, { root: true }); break;
      case 'newPlan': var np = newPlan(el.dataset.id); db.plans.push(np); save(); go({ name: 'plan', id: np.id, tab: 'build' }); break;
      case 'openPlan': go({ name: 'plan', id: el.dataset.id, tab: 'build' }); break;
      case 'tab': view.tab = el.dataset.tab; render(); scroller.scrollTop = 0; break;
      case 'togglePrices': p.showPrices = !p.showPrices; el.setAttribute('aria-pressed', p.showPrices); touchPlan(p); break;
      case 'dupPlan': var cp = JSON.parse(JSON.stringify(p)); cp.id = uid(); cp.title = p.title + ' (copy)'; cp.status = 'Draft'; cp.created = cp.updated = Date.now(); db.plans.push(cp); save(); toast('Plan duplicated'); go({ name: 'plan', id: cp.id, tab: 'build' }, { replace: true }); break;
      case 'delPlan': if (!arm(el, 'Tap again to delete')) return; db.plans = db.plans.filter(function (q) { return q.id !== p.id; }); save(); toast('Plan deleted'); goBack(); break;
      case 'planToQuote': var qq = newInvoice(p.clientId, p, 'quote'); toast('Quotation drafted from plan'); go({ name: 'invoice', id: qq.id }); break;
      case 'newQuote':
        if (el.dataset.id) { var nq2 = newInvoice(el.dataset.id, null, 'quote'); go({ name: 'invoice', id: nq2.id }); }
        else pickClientThen(function (id) { var nq3 = newInvoice(id, null, 'quote'); go({ name: 'invoice', id: nq3.id }); });
        break;
      case 'convertQuote':
        var ni = newInvoice(x.clientId);
        ensureSel(x); ni.sel = JSON.parse(JSON.stringify(x.sel)); ni.custom = JSON.parse(JSON.stringify(x.custom || [])); ni.gst = x.gst; ni.discount = x.discount; ni.planId = x.planId; rebuildLines(ni);
        x.status = 'Accepted'; save(); toast('Invoice ' + ni.number + ' created'); go({ name: 'invoice', id: ni.id }, { replace: true }); break;
      case 'setKind':
        var want = el.dataset.k;
        if ((want === 'quote') === isQuote(x)) return;
        x.kind = want; x.status = 'Draft';
        if (want === 'quote') { x.number = S.qPrefix + '-' + String(S.qNextNo++).padStart(4, '0'); }
        else { x.number = S.prefix + '-' + String(S.nextNo++).padStart(4, '0'); db.payments.forEach(function () {}); }
        save(); render(); break;
      case 'addSvcLine':
        var sv = SVC[el.dataset.id]; if (!sv) return;
        var blank = x.lines.length === 1 && !x.lines[0].desc && !+x.lines[0].rate;
        var line = { desc: sv.name + (sv.billing === 'Monthly' ? ' (per month)' : ' (one-time)'), qty: 1, rate: +sv.fee || 0 };
        if (blank) x.lines[0] = line; else x.lines.push(line);
        save(); document.getElementById('lines').innerHTML = x.lines.map(lineHTML).join(''); document.getElementById('sumbox').innerHTML = sumHTML(x); toast(sv.name + ' added'); break;
      case 'openServices': go({ name: 'services' }); break;
      case 'fillPlan': var fp = plan(el.dataset.id); if (!fp) return; ensureSel(x); loadPlanInto(x, fp); x.sel.months = String(fp.months || x.sel.months); touchInv(x); render(); toast('Filled from ' + fp.title); break;
      case 'clearSel': ensureSel(x); SERVICES.forEach(function (s) { x.sel.items[s.id].on = false; }); x.custom = []; x.planId = null; touchInv(x); render(); break;
      case 'newCItem': openCItem(null); break;
      case 'editCItem': openCItem(el.dataset.id); break;
      case 'newSvc': openSvc(null); break;
      case 'editSvc': openSvc(el.dataset.id); break;
      case 'toggleQr': S.showQr = S.showQr === false; el.setAttribute('aria-pressed', S.showQr !== false); save(); break;
      case 'planToInvoice': var inv1 = newInvoice(p.clientId, p); toast('Invoice drafted from plan'); go({ name: 'invoice', id: inv1.id }); break;
      case 'planReminders':
        var st0 = p.start || today(), n = +p.months || 1, made = 0;
        for (var k = 1; k <= n; k++) { db.reminders.push({ id: uid(), clientId: p.clientId, title: (k < n ? 'Monthly payment due (month ' + (k + 1) + ')' : 'Plan renewal'), date: addMonths(st0, k), time: '', repeat: 'none', done: false, created: Date.now() }); made++; }
        save(); toast(plural(made, 'reminder') + ' added'); break;
      case 'copyPlan': copyText(planMessage(p), function (ok) { toast(ok ? 'Message copied' : 'Copy didn’t work here'); }); break;
      case 'planSent': if (p.status === 'Draft') { p.status = 'Sent'; touchPlan(p); } break;
      case 'newInvoice':
        if (el.dataset.id) { var inv2 = newInvoice(el.dataset.id); go({ name: 'invoice', id: inv2.id }); }
        else pickClientThen(function (id) { var inv3 = newInvoice(id); go({ name: 'invoice', id: inv3.id }); });
        break;
      case 'openInvoice': go({ name: 'invoice', id: el.dataset.id }); break;
      case 'invFilter': view.f = el.dataset.f; render(); break;
      case 'allPay': view.allPay = !view.allPay; render(); break;
      case 'ctab': view.ctab = el.dataset.tab; render(); break;
      case 'rmLine':
        var k3 = el.dataset.k || ''; ensureSel(x);
        if (k3.indexOf('svc:') === 0) { var it3 = x.sel.items[k3.slice(4)]; if (it3) it3.on = false; }
        else if (k3.indexOf('cus:') === 0) x.custom = x.custom.filter(function (c) { return c.id !== k3.slice(4); });
        rebuildLines(x); save(); render(); break;
      case 'pickSvc': openSvcPicker(); break;
      case 'editSvcLine': openSvcEdit(el.dataset.id); break;
      case 'saveBill':
        if (!x.lines.length) { toast('Add an item first'); return; }
        if (x.status === 'Draft') x.status = isQuote(x) ? 'Sent' : 'Final';
        save(); toast((isQuote(x) ? 'Quotation ' : 'Bill ') + x.number + ' saved'); goBack(); break;
      case 'addLine': x.lines.push({ desc: '', qty: 1, rate: 0 }); save(); document.getElementById('lines').innerHTML = x.lines.map(lineHTML).join(''); var li = document.querySelector('[data-l="desc"][data-i="' + (x.lines.length - 1) + '"]'); if (li) li.focus(); break;
      case 'delLine': x.lines.splice(+el.dataset.i, 1); if (!x.lines.length) x.lines.push({ desc: '', qty: 1, rate: 0 }); save(); document.getElementById('lines').innerHTML = x.lines.map(lineHTML).join(''); document.getElementById('sumbox').innerHTML = sumHTML(x); break;
      case 'finalise': x.status = 'Final'; save(); toast('Invoice finalised'); render(); break;
      case 'toDraft': x.status = 'Draft'; save(); render(); break;
      case 'delInvoice':
        if (!arm(el, 'Tap again to delete')) return;
        db.payments.forEach(function (q) { if (q.invoiceId === x.id) q.invoiceId = ''; });
        db.invoices = db.invoices.filter(function (q) { return q.id !== x.id; }); save(); toast('Invoice deleted'); goBack(); break;
      case 'invPreview': go({ name: 'invPreview', id: x.id }); break;
      case 'fmt': view.fmt = el.dataset.f; single(el); break;
      case 'saveInv': makeInvFile(function (f) { saveFile(f.name, f.blob); }); break;
      case 'shareWa': if (x.status === 'Draft') { x.status = isQuote(x) ? 'Sent' : 'Final'; save(); } shareInvoice(); break;
      case 'backup': copyText(JSON.stringify(db), function (ok) { toast(ok ? 'Backup copied' : 'Copy didn’t work here'); }); break;
      case 'restore':
        try { var d = JSON.parse(document.getElementById('restore').value.trim()); if (!d || !Array.isArray(d.clients) || !d.settings) throw 0;
          ['payments', 'invoices', 'plans', 'work', 'reminders', 'customServices'].forEach(function (k) { d[k] = d[k] || []; }); d.svcOverrides = d.svcOverrides || {}; db = d; S = db.settings; rebuildServices(); save(); toast('Backup restored'); go({ name: 'home' }, { root: true });
        } catch (err) { toast('That doesn’t look like a backup'); }
        break;
      case 'wipe': if (!arm(el, 'Tap again to delete everything')) return; ['clients', 'plans', 'invoices', 'payments', 'work', 'reminders'].forEach(function (k) { db[k] = []; }); save(); toast('All data deleted'); go({ name: 'home' }, { root: true }); break;
    }
  }
  vw.addEventListener('click', onClick);
  barHost.addEventListener('click', onClick);

  vw.addEventListener('input', function (e) {
    var el = e.target;
    if (view.name === 'plan') {
      var p = plan(view.id);
      if (el.dataset.fee) { p.items[el.dataset.fee].fee = Math.max(0, +el.value || 0); touchPlan(p); refreshHead(el.dataset.fee, p.items); }
      else if (el.dataset.optv) { p.items[el.dataset.optv].opts[el.dataset.k] = el.value; touchPlan(p); }
      else if (el.dataset.xtra) { p.items[el.dataset.xtra].extra = el.value; touchPlan(p); }
      else if (el.dataset.num) { p.items[el.dataset.num].opts[el.dataset.k] = el.value; touchPlan(p); }
      else if (el.dataset.pf) { p[el.dataset.pf] = el.value; touchPlan(p); }
    } else if (view.name === 'invoice') {
      var x = invoice(view.id);
      if (el.dataset.fee) { x.sel.items[el.dataset.fee].fee = Math.max(0, +el.value || 0); touchInv(x); refreshHead(el.dataset.fee, x.sel.items); return; }
      if (el.dataset.num) { x.sel.items[el.dataset.num].opts[el.dataset.k] = el.value; touchInv(x); return; }
      if (el.dataset.optv) { x.sel.items[el.dataset.optv].opts[el.dataset.k] = el.value; touchInv(x); return; }
      if (el.dataset.xtra) { x.sel.items[el.dataset.xtra].extra = el.value; touchInv(x); return; }
      if (el.hasAttribute('data-bmv')) { x.sel.months = String(Math.max(1, parseInt(el.value, 10) || 1)); touchInv(x); return; }
      if (el.dataset.l) {
        var ln = x.lines[+el.dataset.i]; ln[el.dataset.l] = el.dataset.l === 'desc' ? el.value : (el.value === '' ? '' : +el.value);
        var lt = document.getElementById('lt-' + el.dataset.i); if (lt) lt.textContent = inr((+ln.qty || 0) * (+ln.rate || 0));
      } else if (el.dataset.if && el.tagName !== 'SELECT') { x[el.dataset.if] = el.dataset.if === 'discount' ? (+el.value || 0) : el.value; }
      save(); document.getElementById('sumbox').innerHTML = sumHTML(x);
    } else if (view.name === 'settings' && el.dataset.set) {
      S[el.dataset.set] = (el.dataset.set === 'nextNo' || el.dataset.set === 'qNextNo') ? Math.max(1, parseInt(el.value, 10) || 1) : el.value; save();
    }
  });
  vw.addEventListener('change', function (e) {
    var el = e.target;
    if (view.name === 'invoice' && el.dataset.if === 'clientId') { var xc = invoice(view.id); xc.clientId = el.value; xc.planId = null; save(); render(); }
  });

  render();
})();

</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
